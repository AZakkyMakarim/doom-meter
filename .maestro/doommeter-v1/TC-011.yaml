# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-011 Simulated scrolling shows the same numbers on Today and in the debug summary"
tags: [smoke]
---
- runFlow: _common/ready.yaml
- runFlow: _common/to-debug.yaml
- runFlow: _common/prime.yaml
- tapOn: "[+]10 videos"
- tapOn: "End simulated session"
- assertVisible: "1[01] videos · .* · Drifting"
- runFlow: _common/to-top.yaml
- assertVisible: "1[01]"
- assertVisible: "videos"
- assertVisible: "Drifting"
- assertVisible: "By platform"

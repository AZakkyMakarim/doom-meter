# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-023 Count Tier boundary at 120 videos - 119 is Cooked, 120 is Terminal"
---
- runFlow: _common/ready.yaml
- runFlow: _common/to-debug.yaml
- runFlow: _common/prime.yaml
- repeat:
    times: 11
    commands:
      - tapOn: "[+]10 videos"
- repeat:
    times: 9
    commands:
      - tapOn: "[+]1 video"
- tapOn: "End simulated session"
- assertVisible: "(119 videos · .* · Cooked|120 videos · .* · Terminal)"
- tapOn: "[+]1 video"
- tapOn: "End simulated session"
- assertVisible: "12[01] videos · .* · Terminal"

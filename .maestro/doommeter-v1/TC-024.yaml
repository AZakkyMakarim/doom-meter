# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-024 Minutes Tier boundaries at 10, 30, 60 and 120 minutes"
---
- runFlow: _common/ready.yaml
- runFlow: _common/to-debug.yaml
- tapOn: "[+]5 min"
- runFlow: _common/to-debug.yaml
- assertVisible: "[0-9]+ videos? · .* · Fresh"
- tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Drifting"
- repeat:
    times: 3
    commands:
      - tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Drifting"
- tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Doomed"
- tapOn: "[+]30 min"
- repeat:
    times: 4
    commands:
      - tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Doomed"
- tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Cooked"
- tapOn: "[+]30 min"
- repeat:
    times: 4
    commands:
      - tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Cooked"
- tapOn: "[+]5 min"
- assertVisible: "[0-9]+ videos? · .* · Terminal"

# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-032 Thresholds that do not ascend are rejected with a message and the old values stay"
---
- runFlow: _common/ready.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Drifting videos"
    direction: DOWN
- tapOn: "Drifting videos"
- eraseText
- inputText: "50"
- hideKeyboard
- scrollUntilVisible:
    element: "Save thresholds"
    direction: DOWN
- tapOn: "Save thresholds"
- assertVisible: "Error: Tier thresholds for videos must ascend.*"
- tapOn: "Today"
- runFlow: _common/to-debug.yaml
- runFlow: _common/prime.yaml
- tapOn: "[+]10 videos"
- tapOn: "End simulated session"
- assertVisible: "1[01] videos · .* · Drifting"

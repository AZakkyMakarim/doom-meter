# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-035 Compact mode and Haptics toggles persist after a restart"
---
- runFlow: _common/ready.yaml
- tapOn: "Settings"
- tapOn: "Compact mode"
- tapOn: "Haptics"
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- assertVisible:
    text: "Compact mode"
    checked: true
- assertVisible:
    text: "Haptics"
    checked: false
- assertVisible:
    text: "Show overlay pill"
    checked: true

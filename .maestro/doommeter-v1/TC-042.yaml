# setup: a11y=on overlay=allow usage=allow
appId: com.doommeter
name: "TC-042 The 7-day chart on Today labels every bar and exposes a text summary"
---
- runFlow: _common/ready.yaml
- runFlow: _common/to-debug.yaml
- runFlow: _common/prime.yaml
- tapOn: "[+]10 videos"
- tapOn: "End simulated session"
- scrollUntilVisible:
    element: "Last 7 days"
    direction: UP
- assertVisible: "Last 7 days"
- assertVisible: "Last 7 days\\. 10 videos, .* in total\\..*"
- assertVisible: "1[01]"
- assertVisible: "0"

# setup: a11y=on overlay=allow usage=allow font=2.0
appId: com.doommeter
name: "TC-063 At the largest font scale the count, time and Tier are fully visible on Today"
---
- runFlow: _common/ready.yaml
- runFlow: _common/to-debug.yaml
- runFlow: _common/prime.yaml
- tapOn: "[+]10 videos"
- tapOn: "End simulated session"
- runFlow: _common/to-top.yaml
- assertVisible: "1[01]"
- assertVisible: "videos"
- assertVisible: "Drifting"
- assertVisible: "[0-9]+:[0-9]{2}"

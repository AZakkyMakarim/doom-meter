<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoomMeter Moods</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #020617; color: #F8FAFC; font-family: system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .pill { display: flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 0 16px 0 6px; background: #0B0D14; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .pill img { display: block; }
  .count { font-family: ui-monospace, monospace; font-weight: 700; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .time { font-family: ui-monospace, monospace; font-size: 14px; color: #94A3B8; }
</style>
</head>
<body>
<h1>DoomMeter mood avatars</h1>
<div class="pill" style="height:44px;border:1px solid #FACC1566"><img src="mood-0-vibing.svg" width="32" height="32" alt=""><span class="count" style="font-size:20px">4</span><span class="time">02:10</span><span class="label" style="color:#FACC15">Vibing</span></div>
<div class="pill" style="height:44px;border:1.5px solid #FB923C"><img src="mood-1-cooked.svg" width="32" height="32" alt=""><span class="count" style="font-size:20px">18</span><span class="time">14:32</span><span class="label" style="color:#FB923C">Cooked</span></div>
<div class="pill" style="height:48px;border:2px solid #F87171"><img src="mood-2-washed.svg" width="36" height="36" alt=""><span class="count" style="font-size:22px">47</span><span class="time">38:12</span><span class="label" style="color:#F87171">Washed</span></div>
<div class="pill" style="height:52px;border:2px solid #A3E635"><img src="mood-3-brainrot.svg" width="40" height="40" alt=""><span class="count" style="font-size:24px">85</span><span class="time">1:12:40</span><span class="label" style="color:#A3E635">Brainrot</span></div>
<div class="pill" style="height:56px;border:3px solid #6B7280"><img src="mood-4-doomed.svg" width="44" height="44" alt=""><span class="count" style="font-size:26px">163</span><span class="time">2:41:05</span><span class="label" style="color:#9CA3AF">Doomed</span></div>
</body>
</html>
